<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b141c"><title>TradeVision • Primeiro acesso</title><style>body{margin:0;background:linear-gradient(180deg,#0b1b27,#081016);color:#eef6fb;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#101d27;border:1px solid #294354;border-radius:22px;padding:28px;box-sizing:border-box;box-shadow:0 25px 60px #0008}h1{margin:0 0 8px;font-size:30px}.sub{color:#90a5b3;margin-bottom:28px}.brand{display:flex;gap:14px;align-items:center;margin-bottom:26px}.logo{width:58px;height:58px;border-radius:13px;background:linear-gradient(135deg,#12b6dc,#08779a);display:grid;place-items:center;font-size:21px;font-weight:800}label{display:block;color:#b9c9d3;margin:14px 0 7px}input{width:100%;box-sizing:border-box;height:52px;border-radius:10px;border:1px solid #2b4657;background:#0b151d;color:white;padding:0 14px;font-size:16px}button{width:100%;height:52px;border:0;border-radius:10px;background:#12afd4;color:#031219;font-weight:800;font-size:16px;margin-top:18px}.msg{min-height:22px;margin-top:14px;color:#a9bbc6}.ok{color:#52d6a0}.err{color:#ff8585}.small{font-size:12px;color:#67808f;margin-top:22px;text-align:center}</style></head><body><div class="card"><div class="brand"><div class="logo">TV</div><div><h1>TradeVision</h1><div class="sub">Primeiro acesso do CEO</div></div></div><label>E-mail</label><input id="email" type="email" autocomplete="email" value="raphaelbueno.captacao@gmail.com"><label>Crie sua senha</label><input id="password" type="password" autocomplete="new-password" placeholder="Mínimo 10 caracteres"><label>Confirme a senha</label><input id="confirm" type="password" autocomplete="new-password"><button id="create">CRIAR ACESSO</button><div id="msg" class="msg"></div><div class="small">A senha é enviada diretamente para a Aureon Base e armazenada de forma protegida.</div></div><script>const API='https://aureonbase.vercel.app';const PROJECT='tradevision';const $=id=>document.getElementById(id);$('create').onclick=async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value,confirm=$('confirm').value,msg=$('msg');msg.className='msg';if(!email||password.length<10){msg.textContent='Informe o e-mail e uma senha com pelo menos 10 caracteres.';msg.classList.add('err');return}if(password!==confirm){msg.textContent='As senhas não conferem.';msg.classList.add('err');return}$('create').disabled=true;$('create').textContent='CRIANDO...';msg.textContent='Criando acesso...';try{const r=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,project_slug:PROJECT})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(data.error||'erro'),{status:r.status});localStorage.setItem('tv_access',data.access_token||'');localStorage.setItem('tv_refresh',data.refresh_token||'');msg.textContent='Acesso criado com sucesso. Abrindo o TradeVision...';msg.classList.add('ok');setTimeout(()=>location.href='./',900)}catch(e){msg.classList.add('err');msg.textContent=e.status===409?'Este e-mail já possui conta. Use a tela normal de login.':e.status===403?'Este e-mail não está autorizado.':e.status===429?'Muitas tentativas. Aguarde alguns minutos.':'Não foi possível criar o acesso agora.'}finally{$('create').disabled=false;$('create').textContent='CRIAR ACESSO'}};</script></body></html>
